name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and push (e.g. v0.3.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    environment: dockerhub
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            make cd DOCKER=docker VERSION=${{ inputs.image_tag }}
          else
            make cd DOCKER=docker
          fi
